[package]
name = "exe-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.17", features = ["unstable-winit-030"] }
winit = "=0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17"
notify = "8.2"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.17"

[profile.release]
codegen-units = 1
lto = true
